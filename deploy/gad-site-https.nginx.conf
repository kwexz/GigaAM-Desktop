server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gad.ismvp.host;
    ssl_certificate /etc/letsencrypt/live/gad.ismvp.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gad.ismvp.host/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name gad.ismvp.host;
    return 301 https://$host$request_uri;
}
