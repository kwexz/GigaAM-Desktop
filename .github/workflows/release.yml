name: release

# Publishes a GitHub Release with installers every time a v* tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# No signing secrets are configured, so bundles ship unsigned/adhoc
# (Windows: SmartScreen warning, macOS: Gatekeeper quarantine).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            args: --bundles nsis
          - os: macos-14
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: npm ci
      - run: npm run check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}
