name: release

# Publishes a GitHub Release with installers every time a v* tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# macOS ships signed + notarized (Apple secrets); Windows ships unsigned
# until SignPath OSS signing is wired (SmartScreen will warn).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            args: --bundles nsis
            upload_exe: true
          - os: [self-hosted, mac-arm64]
            args: ""
            upload_exe: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: npm ci
      - name: Expose Swift toolchain libs (macOS test harness)
        if: runner.os == 'macOS'
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=$(xcode-select --print-path)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx" >> $GITHUB_ENV
      - run: npm run check
      # Unit tests already run on the Windows job. The macOS test harness
      # cannot start here: its Swift-linked binary fails dyld lookup for
      # libswift_Concurrency (screencapturekit), unrelated to our code.
      - if: runner.os != 'macOS'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          releaseBody: "GigaAM Desktop: локальная транскрибация файлов и живой записи (микрофон/система), GigaAM v3 + Silero VAD полностью офлайн.\n\nWindows x64: установщик NSIS и portable exe (пока без подписи — SmartScreen предупредит).\nmacOS arm64: подписанный и нотаризованный DMG.\n\nМодели (~227 МБ) докачиваются при первом запуске. Подробнее: README.md"
          args: ${{ matrix.args }}
      - name: Attach portable exe to release
        if: matrix.upload_exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} "src-tauri/target/release/gigaam-desktop.exe" --clobber
