name: release

# Publishes a GitHub Release with installers every time a v* tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# macOS ships signed + notarized (Apple secrets); Windows ships unsigned
# until SignPath OSS signing is wired (SmartScreen will warn).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    # Never hang forever: fail fast instead of dangling for hours.
    timeout-minutes: 45
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          releaseBody: |
            ## English

            GigaAM Desktop transcribes imported media and live microphone/system audio locally with GigaAM v3 and Silero VAD. After a one-time verified model download (~227 MB), recognition works offline.

            Windows x64: NSIS installer and portable executable (currently unsigned; SmartScreen may warn).
            macOS 15+ arm64: signed and notarized DMG/app when the macOS release job completes.

            ## Р СѓСЃСЃРєРёР№

            GigaAM Desktop Р»РѕРєР°Р»СЊРЅРѕ С‚СЂР°РЅСЃРєСЂРёР±РёСЂСѓРµС‚ РёРјРїРѕСЂС‚РёСЂРѕРІР°РЅРЅС‹Рµ РјРµРґРёР°С„Р°Р№Р»С‹ Рё Р¶РёРІСѓСЋ Р·Р°РїРёСЃСЊ РјРёРєСЂРѕС„РѕРЅР°/СЃРёСЃС‚РµРјРЅРѕРіРѕ Р·РІСѓРєР° СЃ GigaAM v3 Рё Silero VAD. РџРѕСЃР»Рµ РѕРґРЅРѕРєСЂР°С‚РЅРѕР№ РїСЂРѕРІРµСЂСЏРµРјРѕР№ Р·Р°РіСЂСѓР·РєРё РјРѕРґРµР»РµР№ (~227 РњР‘) СЂР°СЃРїРѕР·РЅР°РІР°РЅРёРµ СЂР°Р±РѕС‚Р°РµС‚ Р±РµР· РёРЅС‚РµСЂРЅРµС‚Р°.

            Windows x64: NSIS-СѓСЃС‚Р°РЅРѕРІС‰РёРє Рё portable exe (Р±РµР· РїРѕРґРїРёСЃРё; SmartScreen РјРѕР¶РµС‚ РїРѕРєР°Р·Р°С‚СЊ РїСЂРµРґСѓРїСЂРµР¶РґРµРЅРёРµ).
            macOS 15+ arm64: РїРѕРґРїРёСЃР°РЅРЅС‹Рµ Рё РЅРѕС‚Р°СЂРёР·РѕРІР°РЅРЅС‹Рµ DMG/app РїРѕСЃР»Рµ Р·Р°РІРµСЂС€РµРЅРёСЏ macOS-Р·Р°РґР°С‡Рё СЂРµР»РёР·Р°.

            Documentation: https://github.com/kwexz/GigaAM-Desktop#readme
            Third-party licenses: https://github.com/kwexz/GigaAM-Desktop/blob/main/docs/THIRD_PARTY_NOTICES.md
          args: --bundles nsis
      - name: Attach portable exe to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} "src-tauri/target/release/gigaam-desktop.exe" --clobber

  publish-macos:
    # GitHub-hosted Apple Silicon provides Xcode 26 and avoids dependence on
    # a privately maintained Mac runner.
    timeout-minutes: 45
    runs-on: macos-26
    steps:
      # Keep the Mac awake for the whole job: if the display sleeps,
      # keychains lock and codesign hangs forever on an approval prompt.
      - name: Prevent sleep during the job (macOS)
        run: (caffeinate -dimsu -t 2700 &)
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Unit tests already run on the Windows job. The macOS test harness
      # cannot start here: its Swift-linked binary fails dyld lookup for
      # libswift_Concurrency (screencapturekit), unrelated to our code.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          releaseBody: |
            ## English

            GigaAM Desktop transcribes imported media and live microphone/system audio locally with GigaAM v3 and Silero VAD. After a one-time verified model download (~227 MB), recognition works offline.

            Windows x64: NSIS installer and portable executable (currently unsigned; SmartScreen may warn).
            macOS 15+ arm64: signed and notarized DMG/app when the macOS release job completes.

            ## Р СѓСЃСЃРєРёР№

            GigaAM Desktop Р»РѕРєР°Р»СЊРЅРѕ С‚СЂР°РЅСЃРєСЂРёР±РёСЂСѓРµС‚ РёРјРїРѕСЂС‚РёСЂРѕРІР°РЅРЅС‹Рµ РјРµРґРёР°С„Р°Р№Р»С‹ Рё Р¶РёРІСѓСЋ Р·Р°РїРёСЃСЊ РјРёРєСЂРѕС„РѕРЅР°/СЃРёСЃС‚РµРјРЅРѕРіРѕ Р·РІСѓРєР° СЃ GigaAM v3 Рё Silero VAD. РџРѕСЃР»Рµ РѕРґРЅРѕРєСЂР°С‚РЅРѕР№ РїСЂРѕРІРµСЂСЏРµРјРѕР№ Р·Р°РіСЂСѓР·РєРё РјРѕРґРµР»РµР№ (~227 РњР‘) СЂР°СЃРїРѕР·РЅР°РІР°РЅРёРµ СЂР°Р±РѕС‚Р°РµС‚ Р±РµР· РёРЅС‚РµСЂРЅРµС‚Р°.

            Windows x64: NSIS-СѓСЃС‚Р°РЅРѕРІС‰РёРє Рё portable exe (Р±РµР· РїРѕРґРїРёСЃРё; SmartScreen РјРѕР¶РµС‚ РїРѕРєР°Р·Р°С‚СЊ РїСЂРµРґСѓРїСЂРµР¶РґРµРЅРёРµ).
            macOS 15+ arm64: РїРѕРґРїРёСЃР°РЅРЅС‹Рµ Рё РЅРѕС‚Р°СЂРёР·РѕРІР°РЅРЅС‹Рµ DMG/app РїРѕСЃР»Рµ Р·Р°РІРµСЂС€РµРЅРёСЏ macOS-Р·Р°РґР°С‡Рё СЂРµР»РёР·Р°.

            Documentation: https://github.com/kwexz/GigaAM-Desktop#readme
            Third-party licenses: https://github.com/kwexz/GigaAM-Desktop/blob/main/docs/THIRD_PARTY_NOTICES.md
