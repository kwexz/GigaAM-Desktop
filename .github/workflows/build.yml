name: build

on:
  push:
  pull_request:

jobs:
  check-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features inference-spike --bin inference-spike
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --bin gigaam-desktop
      - run: npm run tauri build -- --bundles nsis -- --locked
      - name: Measure release artifacts
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, platform
          root = pathlib.Path('src-tauri/target')
          files = [p for p in root.rglob('*') if p.is_file() and ('bundle' in p.parts or p.name.startswith('gigaam-desktop'))]
          report = {
            'platform': platform.platform(),
            'file_count': len(files),
            'total_bytes': sum(p.stat().st_size for p in files),
            'files': [{'path': str(p), 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }
          pathlib.Path('release-measurements.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        # CI artifacts are redundant with release binaries: keep them 2 days.
        with:
          retention-days: 2
          name: gigaam-desktop-windows-2025
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/gigaam-desktop*
            release-measurements.json

  check-macos:
    # GitHub-hosted Apple Silicon includes Xcode 26 and can safely execute PR code.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The macOS test harness currently cannot locate libswift_Concurrency
      # after linking ScreenCaptureKit, so compile tests without executing them.
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features inference-spike --bin inference-spike --no-run
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --bin gigaam-desktop
      - run: npm run tauri build -- --bundles app -- --locked
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 2
          name: gigaam-desktop-macos-26-arm64
          path: src-tauri/target/release/bundle/macos/**
