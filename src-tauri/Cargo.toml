[package]
name = "gigaam-desktop"
version = "0.1.1"
description = "Local GigaAM transcription desktop application"
authors = []
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gigaam_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gigaam-desktop"
path = "src/main.rs"

[[bin]]
name = "inference-spike"
path = "src/bin/inference_spike.rs"
required-features = ["inference-spike"]

[features]
inference-spike = []

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
anyhow = "1.0"
flac-codec = "1.3.3"
half = "2.7"
hound = "3.5"
ndarray = "0.17"
ort = "2.0.0-rc.13"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
rubato = "0.16"
rusqlite = { version = "0.37", features = ["bundled"] }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
symphonia = { version = "0.6.1", features = ["all"] }
sysinfo = "0.37"
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-opener = "2.5.2"
tauri-plugin-single-instance = "2.3.4"

[target."cfg(windows)".dependencies]
wasapi = { path = "../vendor/wasapi" }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.0.0", features = ["macos_15_0"] }
