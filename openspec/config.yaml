schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Проект использует OmniRoute для работы с моделями. 
  Оптимизируй контекст: не перечитывай весь репозиторий без необходимости.

operations:
  apply:
    guidance:
      - "ЗАПРЕЩЕНО завершать сессию или рапортовать об успехе, если в списке tasks.md остались невыполненные чек-боксы [ ]."
      - "Если лимит токенов ответа модели исчерпан, но задача не завершена, агент обязан автоматически продолжить выполнение с того же места, не дожидаясь явного пинка пользователя."
      - "После выполнения каждой микро-задачи обязательно запускай локальные тесты/линтер для верификации кода."

rules:
  tasks:
    - "Каждая подзадача в tasks.md должна быть атомарной и проверяемой."
    - "В конце выполнения группы задач агент обязан предоставить финальный статус по каждому пункту."
    
# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
